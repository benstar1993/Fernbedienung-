; NEC M431 IR-Fernbedienung fuer M5Stack StickS3 (ESP32-S3)
; Quellcode liegt im Arduino-Sketch-Ordner, damit das Projekt
; auch direkt in der Arduino IDE geoeffnet werden kann.
[platformio]
src_dir = NEC_IR_Remote

[env:m5stick-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@^0.3.0
    bblanchon/ArduinoJson@^7.2.0

; OTA-Upload ueber WLAN (Passwort = AP-Passwort):
;   pio run -e m5stick-s3-ota -t upload
[env:m5stick-s3-ota]
extends = env:m5stick-s3
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=necremote
